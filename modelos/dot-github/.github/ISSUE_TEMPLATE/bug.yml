name: 🐞 Relatar um problema
description: Algo não está funcionando como deveria.
labels: ["bug"]
body:
  - type: textarea
    id: o-que-aconteceu
    attributes:
      label: O que aconteceu?
      description: Descreva o problema e o que você esperava que acontecesse.
    validations:
      required: true
  - type: textarea
    id: como-reproduzir
    attributes:
      label: Como reproduzir
      placeholder: |
        1. Abra a tela ...
        2. Clique em ...
        3. Veja o erro
    validations:
      required: true
  - type: input
    id: onde
    attributes:
      label: Onde aconteceu?
      placeholder: "Ex.: Chrome no Android, versão 2.3, ambiente de produção"
  - type: textarea
    id: prints
    attributes:
      label: Prints ou mensagens de erro
      description: Arraste imagens para cá. Não cole senhas, tokens ou dados de clientes.
